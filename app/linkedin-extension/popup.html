<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ceiba ATS - Extractor LinkedIn</title>
    <style>
        body { font-family: system-ui, sans-serif; width: 340px; padding: 12px; background: #f8fafc; margin: 0; }
        h2 { font-size: 13px; margin: 0 0 10px 0; color: #0f172a; }
        .section-title { font-size: 10px; font-weight: bold; color: #1e3a8a; text-transform: uppercase; margin-top: 10px; margin-bottom: 4px; border-bottom: 1px solid #e2e8f0; padding-bottom: 2px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        label { font-size: 10px; font-weight: 600; color: #475569; display: block; margin-top: 4px; }
        input, textarea, select { width: 100%; padding: 5px; font-size: 11px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 38px; }
        button { width: 100%; margin-top: 10px; padding: 8px; font-size: 11px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .btn-extract { background: #00C853; color: white; }
        .btn-send { background: #2563eb; color: white; }
        #status { display: none; margin-top: 8px; padding: 6px; font-size: 10px; border-radius: 4px; white-space: pre-line; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
    </head>
    <body>
    <h2>Ceiba ATS - Extractor LinkedIn</h2>

    <div class="section-title">Información Personal</div>
    <div class="grid-2">
        <div>
        <label>Primer Nombre:</label>
        <input type="text" id="firstName">
        </div>
        <div>
        <label>Segundo Nombre:</label>
        <input type="text" id="middleName">
        </div>
    </div>

    <div class="grid-2">
        <div>
        <label>Primer Apellido:</label>
        <input type="text" id="lastName">
        </div>
        <div>
        <label>Segundo Apellido:</label>
        <input type="text" id="secondLastName">
        </div>
    </div>

    <div class="grid-2">
        <div>
        <label>Teléfono:</label>
        <input type="text" id="phone">
        </div>
    </div>
    <div>
        <label>Correo electrónico (opcional):</label>
        <input type="text" id="email">
    </div>

    <div class="section-title">Ubicación</div>
    <div class="grid-2">
        <div>
        <label>País:</label>
        <input type="text" id="country">
        </div>
        <div>
        <label>Ciudad:</label>
        <input type="text" id="city">
        </div>
    </div>

    <div class="section-title">Perfil Profesional</div>
    <label>Titular / Headline:</label>
    <input type="text" id="headline">

    <label>Resumen Profesional (Acerca de):</label>
    <textarea id="about"></textarea>

    <div class="section-title">Experiencia y Educación</div>
    <label>Lista Experiencia:</label>
    <textarea id="experience"></textarea>

    <label>Universidad / Institución:</label>
    <input type="text" id="education">

    <div class="section-title">Enlaces</div>
    <label>LinkedIn URL:</label>
    <input type="text" id="resumeUrl" readonly>

    <button id="extractBtn" class="btn-extract">📍 Extraer de esta Página</button>
    <button id="sendBtn" class="btn-send">🚀 Sincronizar a BUK</button>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
